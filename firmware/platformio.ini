[platformio]
default_envs = blue, green, red, yellow

[env]
platform = espressif32@6.10.0
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    espressif/toolchain-riscv32-esp@8.4.0+2021r2-patch5
    platformio/tool-esptoolpy@1.40501.0
    platformio/tool-scons@4.40801.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/identity.py
build_flags =
    -std=gnu++17
    ; PROVISIONAL GPIO 3 (D1), active-low to GND. Confirm wiring before flashing.
    ; A0/GPIO2 is reserved for battery sensing, NOT the button.
    -DBUTTON_GPIO=3
build_unflags = -std=gnu++11

[env:blue]
[env:green]
[env:red]
[env:yellow]
